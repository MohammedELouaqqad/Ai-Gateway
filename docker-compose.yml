# Dev local — AI Gateway
#
# Requis avant toute commande ci-dessous — les credentials n'ont plus de repli faible,
# et .env.example ne fournit aucune valeur toute prête pour eux :
#   cp .env.example .env   # puis éditer .env et renseigner chaque mot de passe
#
# PostgreSQL seul :
#   docker compose up database
#
# Stack complète (images figées — rebuild pour chaque change code) :
#   docker compose --profile stack up --build -d
#
# Stack DEV live reload (volumes + HMR Vite + Spring DevTools) :
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml --profile stack up --build
#
# Monitoring seul (si backend natif sur :8080) :
#   docker compose up -d prometheus grafana
#
# Prod-like (seed off) :
#   SPRING_PROFILES_ACTIVE=prod APP_SEED_ENABLED=false docker compose --profile stack up --build -d
#
# Ollama reste sur l'hôte. Keycloak est dans Compose (profil stack).
# Après le 1er démarrage : créer le realm Ai-Gateway + client (voir README).

services:
  # Une seule instance Postgres (recommandé en local) :
  #   Ai_Gateway_DB → backend | keycloak → IdP (bases séparées, même serveur)
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      - "5433:5432"
    volumes:
      # Persistance données Postgres (app + Keycloak)
      - db-data:/var/lib/postgresql/data
      # Crée la base/user keycloak au 1er boot du volume uniquement
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:?}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis garde-fous (RPM / RPD / budget) — noeviction, reconstructible depuis Postgres
  # Dev: port 6379 publié. Prod: ne pas publier le port (réseau Docker interne seul).
  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Garantit la base `keycloak` même si le volume Postgres existait déjà
  # (initdb.d ne rejoue pas sur un data dir non vide).
  keycloak-db-init:
    profiles: ["stack"]
    image: postgres:15
    restart: "no"
    environment:
      PGHOST: ${POSTGRES_HOST:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - ./docker/postgres/init/01-create-keycloak-db.sh:/init-keycloak-db.sh:ro
    entrypoint: ["/bin/bash", "/init-keycloak-db.sh"]
    depends_on:
      database:
        condition: service_healthy

  # SMTP catcher local — reçoit les emails de vérification/reset envoyés par Keycloak sans
  # jamais les délivrer réellement. UI web + API REST sur :8025. Aucun credential requis
  # (dev only — un vrai déploiement pointe le realm vers un vrai SMTP, pas ce service).
  mailpit:
    profiles: ["stack"]
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # IdP — issuer public http://localhost:8180 (JWT iss) ; DNS interne "keycloak"
  # Stockage : Postgres (base `keycloak`), pas H2 — realm/users survivent au restart
  keycloak:
    profiles: ["stack"]
    image: quay.io/keycloak/keycloak:26.0
    # --import-realm : importe ./docker/keycloak/import/*.json au 1er boot d'un volume Postgres
    # vide uniquement (realm déjà existant = skip, jamais d'écrasement silencieux d'une config
    # modifiée à la main). Reproduit le realm Ai-Gateway (registration + verify email + SMTP
    # mailpit + rôle USER par défaut + password policy + brute force) sans reclic manuel.
    command: ["start-dev", "--http-port=8080", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:?}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST:?}:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./docker/keycloak/import:/opt/keycloak/data/import:ro
    depends_on:
      database:
        condition: service_healthy
      keycloak-db-init:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy
    healthcheck:
      # Management interface (:9000) — Keycloak 26. First boot can take 90–120s+.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  backend:
    profiles: ["stack"]
    build: ./backend
    # Alias DNS "gateway" pour le scrape Prometheus
    hostname: gateway
    networks:
      default:
        aliases:
          - gateway
    ports:
      - "8080:8080"
    # 8081 = actuator/prometheus (management.server.port) — deliberately NOT published to the
    # host, only reachable from other containers on this Docker network (e.g. prometheus).
    expose:
      - "8081"
    env_file:
      - ./backend/.env
    environment:
      DB_URL: jdbc:postgresql://${POSTGRES_HOST:?}:5432/${POSTGRES_DB:?}
      DB_USERNAME: ${POSTGRES_USER:?}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      APP_SEED_ENABLED: "true"
      # iss du JWT = URL vue par le navigateur (port hôte 8180)
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/Ai-Gateway
      # JWKS via DNS Docker (évite host.docker.internal pour Keycloak)
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/Ai-Gateway/protocol/openid-connect/certs
      APP_REDIS_ENABLED: "true"
      APP_REDIS_HOST: redis
      APP_REDIS_PORT: "6379"
      APP_REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      APP_REDIS_RL_FAIL_OPEN: "false"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  frontend:
    profiles: ["stack"]
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8080
      MANAGEMENT_PROXY_TARGET: http://backend:8081
      KEYCLOAK_PROXY_TARGET: http://keycloak:8080
      KEYCLOAK_PUBLIC_HOST: localhost:8180
      VITE_GRAFANA_URL: http://localhost:3000
      VITE_PROMETHEUS_URL: http://localhost:9090
      PROMETHEUS_PROXY_TARGET: http://prometheus:9090
    depends_on:
      backend:
        condition: service_started
      keycloak:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ai-gateway.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db-data:
  redis-data:
  prometheus_data:
  grafana_data:
