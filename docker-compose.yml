# Dev local — AI Gateway
#
# PostgreSQL seul (recommandé : backend/frontend en natif sur la machine) :
#   docker compose up database
#   export DB_URL=jdbc:postgresql://localhost:5433/Ai_Gateway_DB
#   ./mvnw spring-boot:run   # backend
#   npm run dev              # frontend
#
# Stack complète dans Docker (Ollama doit tourner sur l'hôte) :
#   docker compose --profile stack up --build
# Prod-like (seed off, logs quiet) :
#   SPRING_PROFILES_ACTIVE=prod docker compose --profile stack up --build

services:
  database:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: Ai_Gateway_DB
    ports:
      - "5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d Ai_Gateway_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    profiles: ["stack"]
    build: ./backend
    ports:
      - "8080:8080"
    env_file:
      - ./backend/.env
    environment:
      DB_URL: jdbc:postgresql://database:5432/Ai_Gateway_DB
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      APP_SEED_ENABLED: "true"
      # iss du JWT reste localhost:8180 ; JWKS joignable depuis le conteneur via host-gateway
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/Ai-Gateway
      KEYCLOAK_JWK_SET_URI: http://host.docker.internal:8180/realms/Ai-Gateway/protocol/openid-connect/certs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      database:
        condition: service_healthy

  frontend:
    profiles: ["stack"]
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: http://backend:8080
      # Keycloak tourne sur l'hôte (pas dans ce compose) — pas localhost du conteneur
      KEYCLOAK_PROXY_TARGET: http://host.docker.internal:8180
      # Host vu par Keycloak → claim iss du JWT (doit matcher KEYCLOAK_ISSUER_URI)
      KEYCLOAK_PUBLIC_HOST: localhost:8180
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend

volumes:
  db-data:
