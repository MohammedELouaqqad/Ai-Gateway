# Intelligent model routing (v1)
# Runtime overrides via PUT /api/admin/routing/config (until restart)

app:
  routing:
    enabled: true
    # SHADOW = decide + log, still use default model | ACTIVE = use ranked winner
    mode: SHADOW
    profile: BALANCED
    max-retries: 1
    retry-backoff-ms: 200
    default-context-chars: 120000
    # Optional per-model context windows (chars). Missing → default-context-chars
    context-windows: {}
    # Soft preference scores 0–100 (missing → 50)
    model-scores:
      llama3.2:1b:
        quality: 35
        speed: 95
      gpt-4o-mini:
        quality: 75
        speed: 80
      gpt-4o:
        quality: 95
        speed: 55
      gpt-4o-azure:
        quality: 95
        speed: 55
    profiles:
      ECONOMY:
        cost: 0.70
        quality: 0.15
        speed: 0.15
      QUALITY:
        cost: 0.10
        quality: 0.70
        speed: 0.20
      SPEED:
        cost: 0.15
        quality: 0.15
        speed: 0.70
      BALANCED:
        cost: 0.34
        quality: 0.33
        speed: 0.33
