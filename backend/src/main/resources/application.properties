spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:classpath:application-guardrails.yml,optional:classpath:application-redis.yml

spring.application.name=Ai-Gateway
# Phase 1: JPA/Hibernate owns schema (existing repo pattern). Flyway deferred to DB-01 — see docs/db-01/.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
# Dev-friendly defaults ; override with profile "prod" for deployment
spring.jpa.show-sql=true
# No defaults anywhere in this file (not even `:?`, which is compose/shell syntax Spring
# doesn't support — it would literally become part of the value) — every ${VAR} below is
# required: Spring refuses to start with a clear "could not resolve placeholder" error if any
# of them is unset. Matches docker-compose.yml's ${VAR:?} fail-closed pattern for every
# variable, not just secrets — see .env.example / backend/.env.example for the full list.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8080
logging.level.org.springframework.web=debug

# Gateway
app.ollama.base-url=${OLLAMA_BASE_URL}
app.openai.api-key=${OPENAI_API_KEY}
app.seed.enabled=${APP_SEED_ENABLED}
# Nouveaux comptes auto-activés (skip l'approbation ADMIN) — override en profil dev
# (application-dev.properties). Jamais activer en prod : c'est le garde-fou budget LLM contre
# une inscription publique ouverte.
app.users.auto-enable-new=${APP_AUTO_ENABLE_NEW_USERS}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# Uploads (Phase 1 — image attachments via POST /api/files; not yet wired into chat, see
# AttachmentRetentionJob javadoc). allowed-content-types is matched against the SNIFFED
# magic-byte type, never the client-sent header/extension.
app.uploads.enabled=${APP_UPLOADS_ENABLED}
app.uploads.max-size-bytes=${APP_UPLOADS_MAX_SIZE_BYTES}
app.uploads.allowed-content-types=${APP_UPLOADS_ALLOWED_TYPES}
app.uploads.storage-path=${APP_UPLOADS_STORAGE_PATH}
app.uploads.orphan-ttl-hours=${APP_UPLOADS_ORPHAN_TTL_HOURS}
app.uploads.rate-limit.uploads-per-hour=${APP_UPLOADS_RATE_LIMIT_PER_HOUR}

# Multipart hard cap slightly above the LARGER of the two upload features below
# (app.uploads.max-size-bytes for chat images, app.rag.max-size-bytes for RAG PDFs) — a file
# this large never even reaches either service's own size check (see
# GlobalExceptionHandler#handleMaxUploadSize). Each feature still enforces its own, stricter
# limit independently — this is only the shared outer bound.
spring.servlet.multipart.max-file-size=21MB
spring.servlet.multipart.max-request-size=21MB

# RAG (Phase 1 — document ingestion: upload -> extract -> chunk -> embed -> Qdrant. NOT yet
# wired into chat retrieval, see RagIngestionJob/RagDocumentService). Off by default — a
# deployment without Qdrant/an embedding model pulled isn't broken by this feature existing.
app.rag.enabled=${APP_RAG_ENABLED}
app.rag.max-size-bytes=${APP_RAG_MAX_SIZE_BYTES}
app.rag.chunk-chars=${APP_RAG_CHUNK_CHARS}
app.rag.chunk-overlap-chars=${APP_RAG_CHUNK_OVERLAP_CHARS}
app.rag.max-extracted-chars=${APP_RAG_MAX_EXTRACTED_CHARS}
app.rag.extraction-timeout-ms=${APP_RAG_EXTRACTION_TIMEOUT_MS}
app.rag.embedding-model=${APP_RAG_EMBEDDING_MODEL}
app.rag.embedding-dimension=${APP_RAG_EMBEDDING_DIMENSION}
app.rag.rate-limit.uploads-per-hour=${APP_RAG_RATE_LIMIT_PER_HOUR}
app.rag.qdrant.host=${QDRANT_HOST}
app.rag.qdrant.port=${QDRANT_PORT}
app.rag.qdrant.collection=${QDRANT_COLLECTION}
app.rag.qdrant.api-key=${QDRANT_API_KEY}

# JPA
spring.jpa.open-in-view=false

# Garder Tomcat (MVC) même avec WebClient / webflux sur le classpath
spring.main.web-application-type=servlet

# Keycloak OAuth2 Resource Server (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}

# Actuator / Prometheus — served on a separate port, NOT published to the host in
# docker-compose.yml (only reachable from other containers on the Docker network, e.g.
# Prometheus at gateway:8081). Moving it off server.port (8080, published publicly) is what
# actually protects it — /actuator/prometheus has no auth of its own and would otherwise leak
# per-user cost/token metrics to anyone hitting the published port.
management.server.port=${MANAGEMENT_PORT}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# Swagger / OpenAPI (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
