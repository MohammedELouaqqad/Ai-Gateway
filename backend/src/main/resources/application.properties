spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties],optional:classpath:application-guardrails.yml,optional:classpath:application-redis.yml

spring.application.name=Ai-Gateway
# Phase 1: JPA/Hibernate owns schema (existing repo pattern). Flyway deferred to DB-01 — see docs/db-01/.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=update
# Dev-friendly defaults ; override with profile "prod" for deployment
spring.jpa.show-sql=true
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Ai_Gateway_DB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8080
logging.level.org.springframework.web=debug

# Gateway
app.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.openai.api-key=${OPENAI_API_KEY:}
app.seed.enabled=${APP_SEED_ENABLED:true}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JPA
spring.jpa.open-in-view=false

# Garder Tomcat (MVC) même avec WebClient / webflux sur le classpath
spring.main.web-application-type=servlet

# Keycloak OAuth2 Resource Server (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/Ai-Gateway}

# Actuator / Prometheus — served on a separate port, NOT published to the host in
# docker-compose.yml (only reachable from other containers on the Docker network, e.g.
# Prometheus at gateway:8081). Moving it off server.port (8080, published publicly) is what
# actually protects it — /actuator/prometheus has no auth of its own and would otherwise leak
# per-user cost/token metrics to anyone hitting the published port.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when_authorized
management.endpoint.health.show-components=when_authorized
management.endpoint.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

# Swagger / OpenAPI (springdoc)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
