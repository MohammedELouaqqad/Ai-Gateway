spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

spring.application.name=Ai-Gateway
spring.jpa.hibernate.ddl-auto=update
# Dev-friendly defaults ; override with profile "prod" for deployment
spring.jpa.show-sql=true
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/Ai_Gateway_DB}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
server.port=8080
logging.level.org.springframework.web=debug

# Gateway
app.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
app.openai.api-key=${OPENAI_API_KEY:}
app.seed.enabled=${APP_SEED_ENABLED:true}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# JPA
spring.jpa.open-in-view=false

# Garder Tomcat (MVC) même avec WebClient / webflux sur le classpath
spring.main.web-application-type=servlet

# Keycloak OAuth2 Resource Server (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/Ai-Gateway}
