# Profil production — activer avec :
#   SPRING_PROFILES_ACTIVE=prod
# ou : java -jar app.jar --spring.profiles.active=prod

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Garder update tant que Flyway n'est pas en place (DB-01 plus tard)
spring.jpa.hibernate.ddl-auto=update

logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

app.seed.enabled=false

# Keycloak (surcharger via KEYCLOAK_ISSUER_URI en prod)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/Ai-Gateway}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
