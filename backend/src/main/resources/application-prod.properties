# Profil production — activer avec :
#   SPRING_PROFILES_ACTIVE=prod
# ou : java -jar app.jar --spring.profiles.active=prod

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
# Phase 1: Hibernate ddl-auto. Flyway cutover is DB-01 (docs/db-01/).
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=false

logging.level.root=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

app.seed.enabled=false
# Explicite (même valeur que le défaut de base) : jamais d'auto-activation en prod.
app.users.auto-enable-new=false

# Keycloak — required, no default (this profile-specific value takes precedence over the base
# application.properties one, so it needs the same fail-closed treatment independently).
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}
